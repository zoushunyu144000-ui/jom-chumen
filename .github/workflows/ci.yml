name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      VERCEL_ENV: preview
      VITE_AUTH_ENABLED: "true"
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-not-a-production-secret-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Auth invariant
        run: |
          node -e 'const http=require("node:http");const server=http.createServer((req,res)=>{if(req.url==="/__app-env"){res.setHeader("content-type","application/json");res.end(JSON.stringify({VITE_AUTH_ENABLED:process.env.VITE_AUTH_ENABLED}));return;}res.statusCode=404;res.end("Not Found");});server.listen(8080,"127.0.0.1");' &
          AUTH_PROBE_PID=$!
          trap 'kill "$AUTH_PROBE_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/__app-env >/dev/null; then break; fi
            sleep 0.1
          done
          npm run check:auth

      - name: Build
        run: npm run build
